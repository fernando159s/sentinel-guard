; SecuriForm — PHP overrides para desarrollo (Laravel + Filament)

; Errores visibles en desarrollo
display_errors = On
error_reporting = E_ALL
log_errors = On

; Uploads (Filament sube imagenes, PDFs, etc.)
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

; Memoria y tiempo (mPDF y PhpSpreadsheet necesitan mas)
memory_limit = 512M
max_execution_time = 120

; Sesiones
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; Timezone
date.timezone = America/Lima

; Charset
default_charset = "UTF-8"

; OPcache desactivado en desarrollo para ver cambios al instante
opcache.enable = 0

; Necesario para Livewire/Filament uploads
file_uploads = On
