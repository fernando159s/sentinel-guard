services:
  # ── App: PHP 8.2 + Apache + Laravel + Filament ──────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securiform-app
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    environment:
      APP_NAME: SecuriForm
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8082
      APP_TIMEZONE: America/Lima
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: securiform
      DB_USERNAME: securiform
      DB_PASSWORD: securiform_dev_pass
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: noreply@securiform.local
      MAIL_FROM_NAME: SecuriForm
      FILESYSTEM_DISK: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Base de datos: MariaDB 10.11 ────────────────────────────
  db:
    image: mariadb:10.11
    container_name: securiform-db
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root_dev_pass
      MARIADB_DATABASE: securiform
      MARIADB_USER: securiform
      MARIADB_PASSWORD: securiform_dev_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis: cache, sesiones, colas ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: securiform-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── phpMyAdmin ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    container_name: securiform-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: securiform
      PMA_PASSWORD: securiform_dev_pass
    depends_on:
      - db
    restart: unless-stopped

  # ── Tunnelmole: expone la app publicamente ───────────────────
  tunnel:
    image: node:20-alpine
    container_name: securiform-tunnel
    command: >
      sh -c "apk add --no-cache socat &&
             socat TCP-LISTEN:80,fork,reuseaddr TCP:app:80 &
             npm install -g tunnelmole &&
             tmole 80"
    depends_on:
      - app
    restart: unless-stopped

  # ── MailHog: captura emails en desarrollo ───────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: securiform-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  db_data:
  vendor_data:
  node_modules_data:
